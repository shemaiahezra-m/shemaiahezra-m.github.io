<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc">
  <title id="title">Playform furniture showcase</title>
  <desc id="desc">An editorial furniture website preview with colorful sculptural chairs and a warm cream background.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f6f2e9"/><stop offset="1" stop-color="#e9e2d5"/></linearGradient>
    <linearGradient id="chair" x2="1" y2="1"><stop stop-color="#f1a27f"/><stop offset="1" stop-color="#df755e"/></linearGradient>
    <linearGradient id="chair2" x2="1" y2="1"><stop stop-color="#d7dfbd"/><stop offset="1" stop-color="#9eaa7d"/></linearGradient>
    <filter id="shadow" x="-.3" y="-.3" width="1.7" height="1.8"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3c342b" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1200" height="810" fill="url(#paper)"/>
  <circle cx="1030" cy="115" r="175" fill="#f4d66f" opacity=".62"/>
