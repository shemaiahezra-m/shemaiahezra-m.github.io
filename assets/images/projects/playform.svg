  <text x="820" y="72" fill="#57534b" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">SEATING　 TABLES　 LIGHTING</text>
  <text x="72" y="190" fill="#24231f" font-family="Georgia,serif" font-size="77">Objects with</text>
  <text x="72" y="274" fill="#24231f" font-family="Georgia,serif" font-size="77" font-style="italic">a little more soul.</text>
  <text x="77" y="321" fill="#726d62" font-family="Arial,sans-serif" font-size="17" letter-spacing="1">Furniture for spaces that feel like you.</text>
